services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      SHOP_CLIENT_SECRET: ${SHOP_CLIENT_SECRET:-default-dev-secret}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8081:8081"

  shop:
    build:
      context: .
      dockerfile: shop/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - payment-service
    command:
      - "--spring.data.redis.host=redis"
      - "--app.payment.base-url=http://payment-service:8081"
