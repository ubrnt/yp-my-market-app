plugins {
	id 'org.springframework.boot'
	id 'org.openapi.generator'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-webflux-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiGenerate {
	generatorName = 'spring'
	inputSpec = "$rootDir/openapi/payment-api.yaml"
	outputDir = layout.buildDirectory.dir('generated/openapi').get().toString()
	apiPackage = 'ru.yandex.practicum.payment.api'
	modelPackage = 'ru.yandex.practicum.payment.dto'
	configOptions = [
		reactive         : 'true',
		interfaceOnly    : 'true',
		useSpringBoot3   : 'true',
		openApiNullable  : 'false',
		hideGenerationTimestamp: 'true',
		documentationProvider: 'none',
		annotationLibrary: 'none',
	]
}

sourceSets.main.java.srcDir "${openApiGenerate.outputDir.get()}/src/main/java"

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

tasks.named('jar') {
	enabled = false
}
