services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8081:8081"

  shop:
    build:
      context: .
      dockerfile: shop/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - payment-service
    command:
      - "--spring.data.redis.host=redis"
      - "--app.payment.base-url=http://payment-service:8081"
