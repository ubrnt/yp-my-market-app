<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <div class="container p-2">
        <div class="row p-2">
            <div class="col">
                <div class="hstack gap-3">
                    <h2>
                        <a href="/" class="badge text-bg-success text-decoration-none">Витрина магазина</a>
                    </h2>
                </div>
            </div>
        </div>
        <div class="row p-2 justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Вход</h5>
                        <div class="alert alert-danger" th:if="${param.error}">
                            Неверный логин или пароль
                        </div>
                        <div class="alert alert-success" th:if="${param.logout}">
                            Вы вышли из аккаунта
                        </div>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Логин</label>
                                <input type="text" class="form-control" id="username" name="username" required autofocus/>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="password" name="password" required/>
                            </div>
                            <button type="submit" class="btn btn-success w-100 bi bi-box-arrow-in-right"> Войти</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
