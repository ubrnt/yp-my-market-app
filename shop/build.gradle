plugins {
	id 'org.springframework.boot'
	id 'org.openapi.generator'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

	runtimeOnly 'io.r2dbc:r2dbc-h2'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-data-r2dbc-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.testcontainers:testcontainers:1.20.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiGenerate {
	generatorName = 'java'
	library = 'webclient'
	inputSpec = "$rootDir/openapi/payment-api.yaml"
	outputDir = layout.buildDirectory.dir('generated/openapi').get().toString()
	apiPackage = 'ru.yandex.practicum.mymarket.payment.api'
	modelPackage = 'ru.yandex.practicum.mymarket.payment.dto'
	invokerPackage = 'ru.yandex.practicum.mymarket.payment'
	generateApiTests = false
	generateModelTests = false
	generateApiDocumentation = false
	generateModelDocumentation = false
	configOptions = [
		useSpringBoot4         : 'true',
		useJackson3            : 'true',
		openApiNullable        : 'false',
		hideGenerationTimestamp: 'true',
	]
}

tasks.named('test') {
	environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
}

sourceSets.main.java.srcDir "${openApiGenerate.outputDir.get()}/src/main/java"

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

tasks.named('jar') {
	enabled = false
}
