server:
  port: 8080

app:
  items-page:
    row-size: 3
  images:
    url-prefix: images/
    classpath-dir: images/
  payment:
    base-url: http://localhost:8081
  cache:
    items:
      ttl: 120s

spring:
  application:
    name: my-market-app
  security:
    oauth2:
      client:
        registration:
          payment:
            provider: keycloak
            client-id: shop-client
            client-secret: ${SHOP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: payment:read, payment:write
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/my-market/protocol/openid-connect/token}
  r2dbc:
    url: r2dbc:h2:mem:///testdb?options=MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: always
